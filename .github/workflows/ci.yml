name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache ktlint binary
        uses: actions/cache@v4
        with:
          path: .tools
          key: ktlint-1.8.0-${{ runner.os }}
      - name: Check Kotlin style
        run: ./scripts/ktlint.sh check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          ./gradlew :composeApp:testAndroidHostTest :androidApp:test

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release (R8 gate, all ABIs)
        run: ./gradlew :androidApp:assembleRelease -Pwajiha.abiSplits=true
      - name: Verify ABI splits
        run: ./scripts/verify-apk-abis.sh androidApp/build/outputs/apk/release
      - name: Upload unsigned release APKs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-unsigned
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 7

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/.ghcup
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [[ -d "$sdk/system-images" ]]; then
            sudo find "$sdk/system-images" -mindepth 1 -maxdepth 1 ! -name 'android-30' -exec rm -rf {} +
          fi
          sudo rm -rf "$sdk/ndk" "$sdk/ndk-bundle"
          sudo apt-get clean
          df -h
      - name: Cache API 30 system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-30
          key: android-sysimage-api30-google_apis-x86_64-${{ runner.os }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cap Gradle heap for the emulator
        run: |
          sed -i \
            -e 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8/' \
            -e 's/^kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx1g/' \
            gradle.properties
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented + smoke tests
        id: instrumented
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set +e
            ./gradlew :androidApp:connectedDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
            status=$?
            mkdir -p tmp
            adb logcat -d > tmp/instrumented-logcat.txt || true
            exit "$status"
      - name: Retry instrumented tests
        if: steps.instrumented.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          ram-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set +e
            ./gradlew :androidApp:connectedDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"
            status=$?
            mkdir -p tmp
            adb logcat -d > tmp/instrumented-logcat.txt || true
            exit "$status"
      - name: Upload instrumented failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-failure
          path: |
            tmp/instrumented-logcat.txt
            androidApp/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore
