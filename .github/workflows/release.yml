name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Parse tag channel
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=stable
            PRERELEASE=false
            MAKE_LATEST=true
            RELEASE_NAME="Wajiha ${VERSION}"
          elif [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-alpha\.([0-9]+)$ ]]; then
            CHANNEL=alpha
            PRERELEASE=true
            MAKE_LATEST=false
            RELEASE_NAME="Wajiha ${BASH_REMATCH[1]} Alpha ${BASH_REMATCH[2]}"
          elif [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)$ ]]; then
            CHANNEL=beta
            PRERELEASE=true
            MAKE_LATEST=false
            RELEASE_NAME="Wajiha ${BASH_REMATCH[1]} Beta ${BASH_REMATCH[2]}"
          elif [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            CHANNEL=rc
            PRERELEASE=true
            MAKE_LATEST=false
            RELEASE_NAME="Wajiha ${BASH_REMATCH[1]} RC ${BASH_REMATCH[2]}"
          else
            echo "Unsupported tag: ${TAG}" >&2
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
            echo "prerelease=${PRERELEASE}"
            echo "make_latest=${MAKE_LATEST}"
            echo "release_name=${RELEASE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Require release signing secrets
        env:
          WAJIHA_KEYSTORE_BASE64: ${{ secrets.WAJIHA_KEYSTORE_BASE64 }}
          WAJIHA_KEYSTORE_PASSWORD: ${{ secrets.WAJIHA_KEYSTORE_PASSWORD }}
          WAJIHA_KEY_ALIAS: ${{ secrets.WAJIHA_KEY_ALIAS }}
          WAJIHA_KEY_PASSWORD: ${{ secrets.WAJIHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${WAJIHA_KEYSTORE_BASE64:-}" ]] || missing+=(WAJIHA_KEYSTORE_BASE64)
          [[ -n "${WAJIHA_KEYSTORE_PASSWORD:-}" ]] || missing+=(WAJIHA_KEYSTORE_PASSWORD)
          [[ -n "${WAJIHA_KEY_ALIAS:-}" ]] || missing+=(WAJIHA_KEY_ALIAS)
          [[ -n "${WAJIHA_KEY_PASSWORD:-}" ]] || missing+=(WAJIHA_KEY_PASSWORD)
          if ((${#missing[@]})); then
            echo "Missing required release secrets: ${missing[*]}" >&2
            echo "See docs/ci.md for how to create the upload keystore and configure secrets." >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          WAJIHA_KEYSTORE_BASE64: ${{ secrets.WAJIHA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wajiha-signing"
          echo "$WAJIHA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wajiha-signing/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/wajiha-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          WAJIHA_KEYSTORE_PASSWORD: ${{ secrets.WAJIHA_KEYSTORE_PASSWORD }}
          WAJIHA_KEY_ALIAS: ${{ secrets.WAJIHA_KEY_ALIAS }}
          WAJIHA_KEY_PASSWORD: ${{ secrets.WAJIHA_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease \
            -Pwajiha.versionName="${{ steps.meta.outputs.version }}" \
            -Pwajiha.versionCode="${{ github.run_number }}" \
            -Pwajiha.keystore.path="${{ env.KEYSTORE_PATH }}" \
            -Pwajiha.keystore.password="${WAJIHA_KEYSTORE_PASSWORD}" \
            -Pwajiha.key.alias="${WAJIHA_KEY_ALIAS}" \
            -Pwajiha.key.password="${WAJIHA_KEY_PASSWORD}"

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="$(ls androidApp/build/outputs/apk/release/*.apk | head -n1)"
          DEST="dist/Wajiha-${{ steps.meta.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=${DEST}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: ${{ steps.apk.outputs.apk_path }}
