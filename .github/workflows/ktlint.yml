name: ktlint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache ktlint binary
        uses: actions/cache@v4
        with:
          path: .tools
          key: ktlint-1.8.0-${{ runner.os }}
      - name: Check Kotlin style
        run: ./scripts/ktlint.sh check
